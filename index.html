<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-card">
    <h2>Calculadora de IMC</h2>
    <p class="subtitle">Calcula tu Índice de Masa Corporal</p>

    <!-- Formulario -->
    <form id="imc-form">
      <input type="number" id="peso" placeholder="Peso en kg (ej. 70)" step="0.1" required>
      <input type="number" id="altura" placeholder="Altura en cm (ej. 175)" step="0.1" required>
      <button type="submit">Calcular</button>
    </form>

    <!-- Resultado -->
    <div id="resultado" class="resultado oculto">
      <span class="imc-valor" id="imc-numero">0.0</span>
      <p class="imc-estado" id="imc-clasificacion"></p>
      <p class="imc-info" id="imc-mensaje"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
