<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-card">
    <h2>Calculadora de IMC</h2>
    <p class="subtitle">Calcula tu Índice de Masa Corporal</p>

    <form id="imc-form">
      <div class="input-group">
        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" placeholder="Ej. 70" step="0.1" required>
      </div>

      <div class="input-group">
        <label for="altura">Altura (cm)</label>
        <input type="number" id="altura" placeholder="Ej. 175" step="0.1" required>
      </div>

      <button type="submit" id="btn-calcular">Calcular IMC</button>
    </form>

    <div id="resultado" class="resultado oculto">
      <span class="imc-valor" id="imc-numero">0.0</span>
      <p class="imc-estado" id="imc-clasificacion">Normal</p>
      <p class="imc-info" id="imc-mensaje"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
